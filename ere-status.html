<head>
<title> ERE Negotiation Status </title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#008000" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#06140b" media="(prefers-color-scheme: dark)">

<style>
:root {
  color-scheme: light dark;
  --page-background: #ffffff;
  --status-background: #008000;
  --status-text: #ffffff;
  --button-background: rgba(255, 255, 255, 0.16);
  --button-background-hover: rgba(255, 255, 255, 0.28);
  --button-border: rgba(255, 255, 255, 0.65);
  --button-shadow: rgba(0, 0, 0, 0.25);
  --meme-shadow: rgba(0, 0, 0, 0.35);
  --modal-backdrop: rgba(0, 0, 0, 0.55);
  --modal-background: #ffffff;
  --modal-text: #102116;
  --modal-border: rgba(0, 0, 0, 0.12);
}

@media (prefers-color-scheme: dark) {
  :root {
    --page-background: #06140b;
    --status-background: #0b3d1c;
    --status-text: #f6fff7;
    --button-background: rgba(246, 255, 247, 0.12);
    --button-background-hover: rgba(246, 255, 247, 0.22);
    --button-border: rgba(246, 255, 247, 0.55);
    --button-shadow: rgba(0, 0, 0, 0.5);
    --meme-shadow: rgba(0, 0, 0, 0.6);
    --modal-backdrop: rgba(0, 0, 0, 0.72);
    --modal-background: #0f2417;
    --modal-text: #f6fff7;
    --modal-border: rgba(246, 255, 247, 0.16);
  }
}

.container {
  background-color:var(--status-background);
  color:var(--status-text);
  box-sizing:border-box;
  width:100%;
  height:100%;
  min-height:100dvh;
  padding:clamp(1.5rem, 6vw, 4rem) 1rem calc(9.5rem + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  flex-wrap:nowrap;
  gap:0.5rem;
  justify-content:center;
  align-items:center;
  font-size:clamp(2rem, 8vw, 3rem);
  line-height:1.08;
  animation: blink 3s infinite;
  position:relative;
  overflow:hidden;
}

.hearts {
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:0;
  overflow:hidden;
}

.container > :not(.hearts) {
  position:relative;
  z-index:1;
}

.heart {
  position:absolute;
  line-height:1;
  opacity:0.85;
  animation:heart-float var(--heart-duration, 4s) ease-in-out infinite;
  animation-delay:var(--heart-delay, 0s);
  transform:rotate(var(--heart-rotation, 0deg));
  text-shadow:0 1px 6px rgba(0, 0, 0, 0.2);
}

@keyframes heart-float {
  0%, 100% {
    transform:translateY(0) rotate(var(--heart-rotation, 0deg)) scale(1);
    opacity:0.65;
  }

  50% {
    transform:translateY(-14px) rotate(calc(var(--heart-rotation, 0deg) + 12deg)) scale(1.08);
    opacity:1;
  }
}

.countdown {
    width: 100%;
    text-align: center;
    display: block;
    font-size: 5rem;
    margin-top: 2rem;
    margin-bottom: 2rem;
}

.text {
    width:min(100%, 18ch);
    text-align:center;
    display:block;
    overflow-wrap:break-word;
}

.subtitle {
    display:block;
    text-align:center;
    max-width:min(100%, 22rem);
    font-size:clamp(1rem, 4.8vw, 1.5rem);
    line-height:1.2;
    color:var(--status-text);
}

.thanks {
    display:block;
    text-align:center;
    max-width:min(100%, 24rem);
    margin-top:1rem;
    font-size:clamp(0.875rem, 3.8vw, 1.125rem);
    line-height:1.5;
    color:var(--status-text);
    opacity:0.92;
}

.thanks-hearts {
    display:block;
    margin:0.35rem 0;
    font-size:clamp(1rem, 4.5vw, 1.35rem);
    letter-spacing:0.2em;
    line-height:1.4;
}

.thanks-hearts .heart-red {
    color:#ff2d2d;
}

.thanks-hearts .heart-orange {
    color:#ff9100;
}

@keyframes blink {  
  0%, 100% {
    opacity: 1;
  }
  75%, 25% {
    opacity: 1;
  }
  50% {
    opacity: 0;
  }
}
body {
    margin:0;
    min-height:100dvh;
    background-color:var(--page-background);
    overflow-x:hidden;
}

.update-button {
  min-height: 2.75rem;
  width: 100%;
  padding: 0.75rem 1rem;
  border: 1px solid var(--button-border);
  border-radius: 8px;
  background-color: var(--button-background);
  color: var(--status-text);
  box-shadow: 0 4px 16px var(--button-shadow);
  cursor: pointer;
  font: 700 0.95rem/1.2 system-ui, sans-serif;
  text-transform: uppercase;
  text-align: center;
  transition: background-color 0.2s ease, transform 0.2s ease;
}

.action-bar {
  position: fixed;
  left: 50%;
  bottom: calc(1rem + env(safe-area-inset-bottom));
  z-index: 1003;
  width: min(18rem, calc(100vw - 2rem));
  max-width: calc(100vw - 2rem);
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  transform: translateX(-50%);
}

.update-button:hover {
  background-color: var(--button-background-hover);
  transform: translateY(-1px);
}

.update-button:focus-visible {
  outline: 3px solid var(--status-text);
  outline-offset: 3px;
}

.meme-overlay {
  position: fixed;
  pointer-events: none;
  z-index: 1000;
  opacity: 0;
  transition: opacity 1.2s ease-in-out;
}

.meme-overlay.visible {
  opacity: 0.92;
  pointer-events: auto;
  cursor: pointer;
}

.meme-overlay img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 4px 12px var(--meme-shadow));
  pointer-events: none;
}

.snap-container {
  position: fixed;
  pointer-events: none;
  z-index: 1001;
  transform-origin: center center;
}

.snap-tile {
  position: absolute;
  will-change: transform, opacity, filter;
}

.fly-overlay {
  position: fixed;
  pointer-events: none;
  z-index: 1002;
  opacity: 0;
  transition: opacity 0.6s ease-in;
}

.fly-overlay.visible {
  opacity: 1;
  pointer-events: auto;
  cursor: pointer;
}

.fly-overlay img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
}

@media (max-width: 480px) {
  .container {
    align-items:stretch;
    padding-left:1.25rem;
    padding-right:1.25rem;
  }

  .text,
  .subtitle,
  .thanks {
    width:100%;
    max-width:none;
  }

  .update-button {
    width:calc(100vw - 2rem);
  }

  .action-bar {
    width:calc(100vw - 2rem);
  }
}

.agreement-modal {
  position: fixed;
  inset: 0;
  z-index: 1010;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  padding-bottom: calc(1rem + env(safe-area-inset-bottom));
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.2s ease, visibility 0.2s ease;
}

.agreement-modal.is-open {
  opacity: 1;
  visibility: visible;
}

.agreement-modal__backdrop {
  position: absolute;
  inset: 0;
  background: var(--modal-backdrop);
}

.agreement-modal__dialog {
  position: relative;
  z-index: 1;
  box-sizing: border-box;
  width: min(100%, 36rem);
  max-height: min(85dvh, 40rem);
  display: flex;
  flex-direction: column;
  border: 1px solid var(--modal-border);
  border-radius: 12px;
  background: var(--modal-background);
  color: var(--modal-text);
  box-shadow: 0 16px 48px var(--button-shadow);
}

.agreement-modal__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 1rem 1.25rem;
  border-bottom: 1px solid var(--modal-border);
}

.agreement-modal__title {
  margin: 0;
  font: 700 1.1rem/1.2 system-ui, sans-serif;
}

.agreement-modal__close {
  flex-shrink: 0;
  width: 2.25rem;
  height: 2.25rem;
  border: 1px solid var(--modal-border);
  border-radius: 8px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: 700 1.25rem/1 system-ui, sans-serif;
}

.agreement-modal__close:hover {
  background: var(--button-background-hover);
}

.agreement-modal__close:focus-visible {
  outline: 3px solid var(--status-background);
  outline-offset: 2px;
}

.agreement-modal__body {
  overflow-y: auto;
  padding: 1.25rem;
  font: 400 1rem/1.55 system-ui, sans-serif;
}

.agreement-modal__body p {
  margin: 0;
}

.agreement-modal__body p + p {
  margin-top: 1rem;
}

.meme-score {
  position: fixed;
  top: calc(1rem + env(safe-area-inset-top));
  right: calc(1rem + env(safe-area-inset-right));
  z-index: 1004;
  min-width: 5.5rem;
  padding: 0.5rem 0.75rem;
  border: 1px solid var(--button-border);
  border-radius: 8px;
  background-color: var(--button-background);
  color: var(--status-text);
  box-shadow: 0 4px 16px var(--button-shadow);
  font: 700 0.9rem/1.2 system-ui, sans-serif;
  text-align: center;
  transition: transform 0.15s ease;
}

.meme-score.is-pop {
  transform: scale(1.08);
}
</style>
</head>

<body>
  <div class="container">
    <div class="hearts" id="hearts" aria-hidden="true"></div>
    <div class="countdown" id="countdown-text">00:00:00</div>
    <div class="text" id="status-text" aria-live="polite">NOTHING TO SEE HERE, YET.</div>
    <div class="subtitle" id="status-subtitle">Come back 3rd June</div>
    <p class="thanks">
      <span class="thanks-hearts" aria-hidden="true">♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥</span>
      Thank you Ricardo Mavi and Carlos — we couldn't have got here without you.
      <span class="thanks-hearts" aria-hidden="true">♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥</span>
    </p>
  </div>
  <div class="action-bar">
    <button class="update-button" id="query-updates" type="button">Query for updates</button>
    <button class="update-button" id="read-agreement" type="button">Read full update</button>
  </div>
  <div class="meme-score" id="meme-score" aria-live="polite">Points: 0</div>
  <div class="agreement-modal" id="agreement-modal" aria-hidden="true">
    <div class="agreement-modal__backdrop" id="agreement-modal-backdrop"></div>
    <div
      class="agreement-modal__dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="agreement-modal-title"
    >
      <header class="agreement-modal__header">
        <h2 class="agreement-modal__title" id="agreement-modal-title">Update</h2>
        <button
          class="agreement-modal__close"
          id="agreement-modal-close"
          type="button"
          aria-label="Close"
        >&times;</button>
      </header>
      <div class="agreement-modal__body" id="agreement-modal-body"></div>
    </div>
  </div>
  <script>
    const TARGET_TIME = new Date("2026-06-03T13:00:00.000Z").getTime();

    const UPDATE_MESSAGES = [
      {
        text: 'HABEMUS AGREEMENT',
        subtitle: 'Come back AT 15H on 3rd June'
      },
      {
        text: 'YAAAAAAAS',
        subtitle: 'See you in a bit'
      },
      {
        text: 'WE DID IT 🔥',
        subtitle: 'Details tomorrow at 15:00 — get some rest'
      },
      {
        text: 'IT\'S A DEAL',
        subtitle: 'Collective meeting 3rd June, 15h'
      },
      {
        text: 'STILL YES',
        subtitle: 'Nothing changed since last click. Still good news.'
      },
      {
        text: 'AGREEMENT CONFIRMED',
        subtitle: 'Same answer. Better every time you ask.'
      },
      {
        text: 'NEGOTIATIONS: CLOSED',
        subtitle: 'See you tomorrow at 15:00 for the full story'
      },
      {
        text: 'HABEMUS PACTUM',
        subtitle: 'Come back AT 15H on 3rd June'
      },
      {
        text: 'THE WAIT IS OVER',
        subtitle: 'Well… almost. Full briefing tomorrow 15h'
      },
      {
        text: 'GOOD NEWS STILL GOOD',
        subtitle: 'Query again if you need another dopamine hit'
      },
      {
        text: '✅ AGREEMENT ✅',
        subtitle: 'Rest tonight. Questions tomorrow at 15:00'
      },
      {
        text: 'SPOILER: WE WON',
        subtitle: 'Details at the meeting — 3rd June, 15h'
      },
    ];

    const AGREEMENT_MESSAGE = `
    Hi everyone,

After a very long day of negotiations, we can confirm that an agreement has been reached with the company. Discussions continued late into the evening and concluded just a short while ago.

We know many of you have been waiting anxiously for news, and we wanted to share this update as soon as possible. We will walk through the details, explain what has been agreed, answer questions and discuss next steps during a collective meeting tomorrow at 15:00.

📅  <redacted>

For tonight, please know that the process has reached a conclusion, and we will make sure everyone has the information they need tomorrow.


Thank you all for your trust, patience, support and the many messages we've received throughout these weeks. Get some rest if you can ( we def will! ) and we'll speak tomorrow. We did it 🔥
`

    const MEME_URLS = [
      'memes/3dpdui.webp',
      'memes/14-me-gusta-22vmrft.webp',
      'memes/529eebeb07a7331a3e0bce7964609817.jpg',
      'memes/download.jpeg',
      'memes/images.jpeg',
      'memes/roll-safe-meme-1.jpg',
      'memes/spongebob-patrick-star.png',
    ];

    const FLY_SRC = 'memes/fly-on-screen.gif';
    const MAX_MEME_IMAGES = 25;
    const MEME_RAMP_MS = 10 * 60 * 1000;
    const MEME_SCORE_STORAGE_KEY = 'ere-meme-score';
    const pageOpenedAt = Date.now();
    let activeMemeImages = 0;
    let activeFly = null;
    let updateMessageIndex = 0;
    let agreementModalBodyPopulated = false;
    let memeScore = 0;
    let memeScorePopTimeout = null;

    function loadMemeScore() {
      const storedScore = Number(window.localStorage.getItem(MEME_SCORE_STORAGE_KEY));
      if (Number.isFinite(storedScore) && storedScore >= 0) {
        memeScore = Math.floor(storedScore);
      }
    }

    function renderMemeScore() {
      const scoreElement = document.getElementById('meme-score');
      if (!scoreElement) return;

      scoreElement.textContent = 'Points: ' + memeScore;
    }

    function popMemeScore() {
      const scoreElement = document.getElementById('meme-score');
      if (!scoreElement) return;

      scoreElement.classList.add('is-pop');
      clearTimeout(memeScorePopTimeout);
      memeScorePopTimeout = setTimeout(function () {
        scoreElement.classList.remove('is-pop');
      }, 150);
    }

    function awardMemePoint() {
      memeScore += 1;
      window.localStorage.setItem(MEME_SCORE_STORAGE_KEY, String(memeScore));
      renderMemeScore();
      popMemeScore();
    }

    const HEART_COLORS = ['#ff2d2d', '#ff1744', '#e53935', '#ff5252', '#ff6f00', '#ff9100', '#ffab40', '#ff5722'];
    const FLOATING_HEART_COUNT = 72;

    function randomBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

    function spawnFloatingHearts() {
      const container = document.getElementById('hearts');
      if (!container) return;

      for (let i = 0; i < FLOATING_HEART_COUNT; i++) {
        const heart = document.createElement('span');
        heart.className = 'heart';
        heart.textContent = '♥';
        heart.style.left = randomBetween(-2, 98) + '%';
        heart.style.top = randomBetween(-2, 98) + '%';
        heart.style.color = HEART_COLORS[Math.floor(Math.random() * HEART_COLORS.length)];
        heart.style.fontSize = randomBetween(14, 42) + 'px';
        heart.style.setProperty('--heart-duration', randomBetween(2.5, 6.5) + 's');
        heart.style.setProperty('--heart-delay', randomBetween(0, 4) + 's');
        heart.style.setProperty('--heart-rotation', randomBetween(-35, 35) + 'deg');
        container.appendChild(heart);
      }
    }

    function colorThanksHearts() {
      const heartRows = document.querySelectorAll('.thanks-hearts');

      for (let rowIndex = 0; rowIndex < heartRows.length; rowIndex++) {
        const row = heartRows[rowIndex];
        const hearts = row.textContent.split(/\s+/).filter(Boolean);
        row.textContent = '';

        for (let heartIndex = 0; heartIndex < hearts.length; heartIndex++) {
          const heart = document.createElement('span');
          heart.textContent = '♥ ';
          heart.className = (rowIndex + heartIndex) % 2 === 0 ? 'heart-red' : 'heart-orange';
          row.appendChild(heart);
        }
      }
    }

    function formatAgreementParagraphs(raw) {
      return raw
        .trim()
        .split(/\n\s*\n/)
        .map(function (paragraph) {
          return paragraph.replace(/\n\s+/g, ' ').trim();
        })
        .filter(Boolean);
    }

    function populateAgreementModalBody() {
      if (agreementModalBodyPopulated) return;

      const body = document.getElementById('agreement-modal-body');
      if (!body) return;

      const paragraphs = formatAgreementParagraphs(AGREEMENT_MESSAGE);
      body.replaceChildren();

      for (let i = 0; i < paragraphs.length; i++) {
        const paragraph = document.createElement('p');
        paragraph.textContent = paragraphs[i];
        body.appendChild(paragraph);
      }

      agreementModalBodyPopulated = true;
    }

    function openAgreementModal() {
      const modal = document.getElementById('agreement-modal');
      const closeButton = document.getElementById('agreement-modal-close');
      if (!modal) return;

      populateAgreementModalBody();
      modal.classList.add('is-open');
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';

      if (closeButton) {
        closeButton.focus();
      }
    }

    function closeAgreementModal() {
      const modal = document.getElementById('agreement-modal');
      const readAgreementButton = document.getElementById('read-agreement');
      if (!modal) return;

      modal.classList.remove('is-open');
      modal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';

      if (readAgreementButton) {
        readAgreementButton.focus();
      }
    }

    function pickRandomUpdateMessageIndex() {
      if (UPDATE_MESSAGES.length <= 1) {
        return 0;
      }

      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * UPDATE_MESSAGES.length);
      } while (nextIndex === updateMessageIndex);

      return nextIndex;
    }

    function queryForUpdates() {
      const text = document.getElementById('status-text');
      const subtitle = document.getElementById('status-subtitle');

      if (!text || !subtitle) return;

      updateMessageIndex = pickRandomUpdateMessageIndex();
      text.textContent = UPDATE_MESSAGES[updateMessageIndex].text;
      subtitle.textContent = UPDATE_MESSAGES[updateMessageIndex].subtitle;
    }

    function getContainedImageRect(img, boxW, boxH) {
      const scale = Math.min(boxW / img.naturalWidth, boxH / img.naturalHeight);
      const w = img.naturalWidth * scale;
      const h = img.naturalHeight * scale;
      return {
        x: (boxW - w) / 2,
        y: (boxH - h) / 2,
        w: w,
        h: h
      };
    }

    function snapExplode(overlay, img) {
      const boxW = overlay.offsetWidth;
      const boxH = overlay.offsetHeight;

      if (!img.naturalWidth || !img.naturalHeight || boxW < 1 || boxH < 1) {
        overlay.remove();
        return;
      }

      const fit = getContainedImageRect(img, boxW, boxH);
      const left = overlay.style.left;
      const top = overlay.style.top;
      const transform = overlay.style.transform;
      const src = img.currentSrc || img.src;
      const step = 5;
      const tiles = [];

      const container = document.createElement('div');
      container.className = 'snap-container';
      container.style.left = left;
      container.style.top = top;
      container.style.width = boxW + 'px';
      container.style.height = boxH + 'px';
      container.style.transform = transform;

      overlay.remove();
      document.body.appendChild(container);

      for (let y = fit.y; y < fit.y + fit.h - 1; y += step) {
        for (let x = fit.x; x < fit.x + fit.w - 1; x += step) {
          const tileW = Math.min(step, fit.x + fit.w - x);
          const tileH = Math.min(step, fit.y + fit.h - y);
          const sliceX = x - fit.x;
          const sliceY = y - fit.y;

          const tile = document.createElement('div');
          tile.className = 'snap-tile';
          tile.style.left = x + 'px';
          tile.style.top = y + 'px';
          tile.style.width = tileW + 'px';
          tile.style.height = tileH + 'px';
          tile.style.backgroundImage = 'url("' + src + '")';
          tile.style.backgroundSize = fit.w + 'px ' + fit.h + 'px';
          tile.style.backgroundPosition = (-sliceX) + 'px ' + (-sliceY) + 'px';
          container.appendChild(tile);

          tiles.push({
            el: tile,
            tx: 0,
            ty: 0,
            vx: randomBetween(-4, 4),
            vy: randomBetween(-8, -2),
            spin: randomBetween(-15, 15),
            life: 1,
            decay: randomBetween(0.004, 0.012),
            delay: Math.random() * 0.8
          });
        }
      }

      if (!tiles.length) {
        container.remove();
        return;
      }

      function frame() {
        let alive = false;

        for (let i = 0; i < tiles.length; i++) {
          const tile = tiles[i];

          if (tile.delay > 0) {
            tile.delay -= 0.016;
            alive = true;
            continue;
          }

          tile.life -= tile.decay;
          if (tile.life <= 0) {
            tile.el.style.opacity = '0';
            continue;
          }

          alive = true;
          tile.tx += tile.vx;
          tile.ty += tile.vy;
          tile.vy -= 0.12;
          tile.vx *= 0.985;

          const dust = 1 - tile.life;
          tile.el.style.transform = 'translate(' + tile.tx + 'px,' + tile.ty + 'px) rotate(' + (tile.spin * dust) + 'deg)';
          tile.el.style.opacity = String(tile.life);
          tile.el.style.filter = 'grayscale(' + Math.floor(dust * 100) + '%) brightness(' + (1 + dust * 0.4) + ')';
        }

        if (alive) {
          requestAnimationFrame(frame);
        } else {
          container.remove();
        }
      }

      requestAnimationFrame(frame);
    }

    function spawnFly() {
      if (activeFly) return;

      const size = randomBetween(44, 72);
      const maxX = Math.max(0, window.innerWidth - size);
      const maxY = Math.max(0, window.innerHeight - size);

      const overlay = document.createElement('div');
      overlay.className = 'fly-overlay';
      overlay.style.width = size + 'px';
      overlay.style.height = size + 'px';
      overlay.style.left = randomBetween(0, maxX) + 'px';
      overlay.style.top = randomBetween(0, maxY) + 'px';
      overlay.style.transform = 'rotate(' + randomBetween(-25, 25) + 'deg)';

      const img = document.createElement('img');
      img.src = FLY_SRC;
      img.alt = '';
      overlay.appendChild(img);
      document.body.appendChild(overlay);
      activeFly = overlay;

      overlay.addEventListener('click', function () {
        if (!overlay.classList.contains('visible')) return;
        activeFly = null;
        overlay.style.transition = 'opacity 0.2s ease-out, transform 0.2s ease-out';
        overlay.style.opacity = '0';
        overlay.style.transform += ' scale(0.4)';
        setTimeout(function () {
          overlay.remove();
        }, 200);
      });

      requestAnimationFrame(function () {
        overlay.classList.add('visible');
      });
    }

    function scheduleFlyAttempt() {
      const delay = randomBetween(90000, 240000);
      setTimeout(function () {
        if (!activeFly && Math.random() < 0.3) {
          spawnFly();
        }
        scheduleFlyAttempt();
      }, delay);
    }

    function spawnMeme() {
      if (activeMemeImages >= MAX_MEME_IMAGES) return false;

      const shortestViewportSide = Math.min(window.innerWidth, window.innerHeight);
      const baseSize = shortestViewportSide * (shortestViewportSide <= 480 ? 0.34 : 0.2);
      const size = baseSize * randomBetween(0.75, 1.25);
      const rotation = randomBetween(-55, 55);
      const maxX = Math.max(0, window.innerWidth - size);
      const maxY = Math.max(0, window.innerHeight - size);

      const overlay = document.createElement('div');
      overlay.className = 'meme-overlay';
      overlay.style.width = size + 'px';
      overlay.style.height = size + 'px';
      overlay.style.left = randomBetween(0, maxX) + 'px';
      overlay.style.top = randomBetween(0, maxY) + 'px';
      overlay.style.transform = 'rotate(' + rotation + 'deg)';

      const img = document.createElement('img');
      img.src = MEME_URLS[Math.floor(Math.random() * MEME_URLS.length)];
      img.alt = '';
      overlay.appendChild(img);
      document.body.appendChild(overlay);
      activeMemeImages += 1;

      let exploded = false;
      let removed = false;
      let fadeTimeout;
      let removeTimeout;

      function clearMemeTimers() {
        clearTimeout(fadeTimeout);
        clearTimeout(removeTimeout);
      }

      function removeMeme() {
        if (removed) return;
        removed = true;
        activeMemeImages -= 1;
        overlay.remove();
      }

      overlay.addEventListener('click', function () {
        if (exploded || !overlay.classList.contains('visible')) return;
        if (!img.complete || !img.naturalWidth) return;
        exploded = true;
        clearMemeTimers();
        activeMemeImages -= 1;
        removed = true;
        awardMemePoint();
        snapExplode(overlay, img);
      });

      requestAnimationFrame(function () {
        overlay.classList.add('visible');
      });

      const visibleMs = randomBetween(2500, 6000);
      fadeTimeout = setTimeout(function () {
        if (exploded) return;
        overlay.classList.remove('visible');
        removeTimeout = setTimeout(function () {
          if (!exploded) removeMeme();
        }, 1200);
      }, visibleMs);

      return true;
    }

    function getMemeSchedule() {
      const ramp = Math.min(1, (Date.now() - pageOpenedAt) / MEME_RAMP_MS);

      return {
        minDelay: 2000 - (ramp * 3100),
        maxDelay: 7000 - (ramp * 12500),
        burstChance: 0.25 + (ramp * 0.6),
        maxBurstImages: 1 + Math.floor(ramp * 3)
      };
    }

    function scheduleNextMeme() {
      const schedule = getMemeSchedule();
      const delay = randomBetween(schedule.minDelay, schedule.maxDelay);
      setTimeout(function () {
        spawnMeme();
        if (Math.random() < schedule.burstChance) {
          const burstImages = Math.floor(randomBetween(1, schedule.maxBurstImages + 1));

          for (let i = 0; i < burstImages; i++) {
            setTimeout(spawnMeme, randomBetween(250, 1200 + (i * 300)));
          }
        }
        scheduleNextMeme();
      }, delay);
    }

    function updateCountdown() {
      const countdownText = document.getElementById("countdown-text");
      if (countdownText) {
        const now = Date.now();
        const timeLeft = TARGET_TIME - now;
        if (timeLeft > 0) {
          const hours = Math.floor(timeLeft / (1000 * 60 * 60));
          const minutes = Math.floor(
            (timeLeft % (1000 * 60 * 60)) / (1000 * 60),
          );
          const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

          countdownText.textContent = `${hours.toString().padStart(2, "0")}:${minutes.toString().padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`;
          setTimeout(updateCountdown, 1000);
        } else {
          countdownText.textContent = "00:00:00";
        }
      }
    }

    const queryUpdatesButton = document.getElementById('query-updates');
    const readAgreementButton = document.getElementById('read-agreement');
    const agreementModal = document.getElementById('agreement-modal');
    const agreementModalBackdrop = document.getElementById('agreement-modal-backdrop');
    const agreementModalClose = document.getElementById('agreement-modal-close');

    if (queryUpdatesButton) {
      queryUpdatesButton.addEventListener('click', queryForUpdates);
    }

    if (readAgreementButton) {
      readAgreementButton.addEventListener('click', openAgreementModal);
    }

    if (agreementModalClose) {
      agreementModalClose.addEventListener('click', closeAgreementModal);
    }

    if (agreementModalBackdrop) {
      agreementModalBackdrop.addEventListener('click', closeAgreementModal);
    }

    if (agreementModal) {
      agreementModal.addEventListener('click', function (event) {
        if (event.target === agreementModal) {
          closeAgreementModal();
        }
      });
    }

    document.addEventListener('keydown', function (event) {
      if (event.key !== 'Escape') return;

      const modal = document.getElementById('agreement-modal');
      if (modal && modal.classList.contains('is-open')) {
        closeAgreementModal();
      }
    });

    updateCountdown();
    loadMemeScore();
    renderMemeScore();
    spawnFloatingHearts();
    colorThanksHearts();
    queryForUpdates();
    setTimeout(scheduleNextMeme, randomBetween(2000, 6000));
    setTimeout(scheduleFlyAttempt, randomBetween(10000, 40000));
  </script>
</body>
